name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: >
          cmake -S . -B build/asan -DCMAKE_BUILD_TYPE=Debug
          -DTRY4_BUILD_TESTS=ON -DTRY4_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build/asan --parallel 2
      - run: ctest --test-dir build/asan --output-on-failure --output-junit build/asan/asan-regression.xml
      - uses: actions/upload-artifact@v4
        with:
          name: try4-asan
          path: build/asan/asan-regression.xml
          if-no-files-found: error

  package:
    needs: sanitizers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure Release
        run: >
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release
          -DTRY4_BUILD_TESTS=ON -DTRY4_WARNINGS_AS_ERRORS=ON
          -DTRY4_PORTABLE_WINDOWS=ON
      - run: cmake --build build/release --config Release --parallel 2
      - run: ctest --test-dir build/release -C Release --output-on-failure --output-junit build/release/regression.xml
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C Release
      - name: Verify extracted archive and checksum
        shell: bash
        run: python scripts/verify_release.py build/release/packages/*.zip
      - name: Archive candidate and reports
        uses: actions/upload-artifact@v4
        with:
          name: try4-${{ matrix.os }}
          path: |
            build/release/packages/*.zip
            build/release/packages/*.sha256
            build/release/regression.xml
          if-no-files-found: error
