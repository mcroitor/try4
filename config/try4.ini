# Optional startup configuration. Copy beside try4_uci as try4.ini, or pass
# --config PATH. This example is installed as documentation, never activated.
# Keys/sections are case sensitive. Comments occupy a whole line only.
[uci]
hash_mb=16
move_overhead_ms=20
threads=1
own_book=true
book_file=
book_max_ply=40

[evaluation]
# Seven material values: empty,pawn,knight,bishop,rook,queen,king.
material_mg=0,100,320,330,500,900,0
material_eg=0,120,300,320,540,900,0
# Eight relative ranks, rank 1 first; Black is mirrored.
passed_mg=0,5,10,20,35,55,80,0
passed_eg=0,10,20,35,55,80,120,0
mobility_mg=3
mobility_eg=2
bishop_pair_mg=30
bishop_pair_eg=50
rook_open_mg=20
rook_open_eg=10
rook_semi_open_mg=10
rook_semi_open_eg=5
doubled_pawn_mg=15
doubled_pawn_eg=20
isolated_pawn_mg=12
isolated_pawn_eg=15
shield_one_mg=12
shield_two_mg=6
shield_missing_mg=10
shield_one_eg=3
shield_two_eg=1
shield_missing_eg=2
king_attacker_mg=12
king_attacker_eg=4
tempo=10
pst_mg_percent=100
pst_eg_percent=100

[search]
# Set true to add quiet checks at the horizon; captures/promotions always run.
forcing_checks=false
forcing_max_plies=8
forcing_hard_plies=32
